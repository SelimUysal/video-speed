name: Video Speed - Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Choose whether to check the connection or publish the current main branch
        required: true
        type: choice
        default: check
        options:
          - check
          - publish
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: video-speed-chrome-web-store
  cancel-in-progress: false

jobs:
  check-connection:
    name: Check Web Store Connection (no publishing)
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Check extension status using service account
        uses: cssnr/webstore-publish-action@v1
        with:
          extension_id: cmjafmcaccbhfgcjnfldaahebnbbppje
          publisher_id: ${{ secrets.CWS_PUBLISHER_ID }}
          json_data: ${{ secrets.WEBSTORE_JSON }}
          status: true

  publish:
    name: Upload & Submit Release
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       github.event.head_commit.message == 'release: submit v1.1.0 to Chrome Web Store')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested release
        uses: actions/checkout@v4

      - name: Validate manifest and release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          if [[ "$REF_TYPE" == 'tag' && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag ($RELEASE_TAG) must equal manifest version (v$version)"
            exit 1
          fi
          if [[ "$EVENT_NAME" == 'push' && "$REF_TYPE" == 'branch' && "$version" != '1.1.0' ]]; then
            echo "One-time branch submission must be version 1.1.0"
            exit 1
          fi

      - name: Validate JavaScript and extension files
        shell: bash
        run: |
          set -euo pipefail
          node --check video-policy.js
          node --check content.js
          node --test tests/*.test.cjs
          node --check popup.js
          node -e "const m=require('./manifest.json');if(m.manifest_version!==3||!m.version||m.default_locale!=='en')process.exit(1);for(const loc of ['en','tr']){const data=require('./_locales/'+loc+'/messages.json');for(const k of ['extName','extShortName','extDescription'])if(!data[k]?.message)process.exit(1)}"
          for path in manifest.json video-policy.js content.js popup.html popup.js styles.css _locales/en/messages.json _locales/tr/messages.json icons/16.png icons/48.png icons/128.png; do
            test -f "$path" || { echo "Missing file: $path"; exit 1; }
          done

      - name: Package extension
        shell: bash
        run: |
          set -euo pipefail
          zip -q -r video-speed.zip manifest.json video-policy.js content.js popup.html popup.js styles.css icons _locales
          unzip -t video-speed.zip

      - name: Upload and submit for Google review
        uses: cssnr/webstore-publish-action@v1
        with:
          extension_id: cmjafmcaccbhfgcjnfldaahebnbbppje
          publisher_id: ${{ secrets.CWS_PUBLISHER_ID }}
          json_data: ${{ secrets.WEBSTORE_JSON }}
          zip_file: video-speed.zip
          publish: default
