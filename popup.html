<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Speed</title><link rel="stylesheet" href="styles.css"></head><body><main><header><span class="logo">▶</span><div><h1>Video Speed</h1><small id="subtitle">Your speed, everywhere</small></div></header><section><div class="section"><b id="heading">Playback speed</b><small id="state">Saved automatically</small></div><div class="speed"><button id="minus" aria-label="Decrease speed">−</button><strong id="value" aria-live="polite">1.5×</strong><button id="plus" aria-label="Increase speed">+</button></div><div class="presets"><button data-speed="1">1×</button><button data-speed="1.5">1.5×</button><button data-speed="2">2×</button><button data-speed="3">3×</button><button data-speed="4">4×</button></div></section><section class="transport"><div class="section"><b id="skipheading">Video controls</b><small id="status">Checking video…</small></div><div class="skip"><button id="rewind">↶ <span id="rewindLabel">10s back</span></button><button id="forward"><span id="forwardLabel">10s forward</span> ↷</button></div></section><footer><p id="hint">Q: 3× · E: 2.5× · D/S: ±0.1× · R: 1× · Z/X: ±10s</p><button id="reset">Reset to 1×</button></footer></main><script src="popup.js"></script></body></html>
